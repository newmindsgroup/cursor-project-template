<!-- Primary Button -->

  data-component="Button"
  data-variant="primary"
>
  Button Text
</button>

<!-- Secondary Button -->
<button
  class="inline-flex items-center justify-center px-6 py-3 text-base font-semibold text-primary-600 bg-primary-50 rounded-lg transition-all duration-300 hover:bg-primary-100 hover:shadow-soft focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 active:scale-95"
  data-component="Button"
  data-variant="secondary"
>
  Button Text
</button>

<!-- Outline Button -->
<button
  class="inline-flex items-center justify-center px-6 py-3 text-base font-semibold text-primary-600 bg-transparent border-2 border-primary-600 rounded-lg transition-all duration-300 hover:bg-primary-600 hover:text-white hover:shadow-medium focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 active:scale-95"
  data-component="Button"
  data-variant="outline"
>
  Button Text
</button>
