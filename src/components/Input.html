<!-- Text Input -->
<div class="w-full" data-component="Input">
  <label for="input-field" class="block mb-2 text-sm font-semibold text-neutral-700">
    Label
  </label>
  <input
    type="text"
    id="input-field"
    name="input-field"
    class="w-full px-4 py-3 text-base text-neutral-900 bg-white border border-neutral-300 rounded-lg transition-colors duration-200 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
    placeholder="Enter text here"
  />
</div>

<!-- Textarea -->
<div class="w-full" data-component="Textarea">
  <label for="textarea-field" class="block mb-2 text-sm font-semibold text-neutral-700">
    Message
  </label>
  <textarea
    id="textarea-field"
    name="textarea-field"
    rows="4"
    class="w-full px-4 py-3 text-base text-neutral-900 bg-white border border-neutral-300 rounded-lg transition-colors duration-200 placeholder:text-neutral-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent resize-y"
    placeholder="Enter your message"
  ></textarea>
</div>
