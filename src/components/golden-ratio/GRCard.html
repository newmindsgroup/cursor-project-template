<!--
  GRCard - Golden Ratio Card Templates
  
  Pre-validated card components with proper padding, borders, and shadows.
  Cards use consistent spacing from the design system.
  
  Padding: p-8 (32px) - matches design rules minimum
  Border radius: rounded-2xl (16px)
  Shadow: shadow-soft (subtle elevation)
-->

<!-- Standard Card -->
<div class="p-8 bg-white rounded-2xl border border-neutral-200 shadow-soft">
  <div class="mb-6">
    <!-- Icon or Image -->
    <div class="w-14 h-14 bg-primary-100 rounded-xl flex items-center justify-center">
      <svg class="w-7 h-7 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
    </div>
  </div>
  <h3 class="text-xl font-bold text-neutral-900 mb-3">
    {Card Title}
  </h3>
  <p class="text-neutral-600 leading-relaxed">
    {Card description text goes here. Keep it concise and focused.}
  </p>
</div>
