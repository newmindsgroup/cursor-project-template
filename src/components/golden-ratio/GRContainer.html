<!--
  GRContainer - Golden Ratio Container Template
  
  Pre-validated container with correct horizontal padding and max-width.
  Use this inside sections to ensure content never touches edges.
  
  Padding values:
  - Mobile: 32px (px-8)
  - Tablet: 48px (md:px-12)
  - Desktop: 64px (lg:px-16)
  
  Max-width options:
  - max-w-7xl (1280px) - default, most sections
  - max-w-6xl (1152px) - slightly narrower
  - max-w-5xl (1024px) - narrow sections
  - max-w-4xl (896px) - content focus
  - max-w-3xl (768px) - text content, forms
  - max-w-2xl (672px) - narrow text
-->

<!-- Standard Container (1280px) -->
<div class="max-w-7xl mx-auto px-8 md:px-12 lg:px-16">
  {Content goes here}
</div>
