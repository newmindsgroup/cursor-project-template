<!--
  GRGrid - Golden Ratio Grid Templates
  
  Pre-built RESPONSIVE grid layouts using Golden Ratio proportions (61.8% / 38.2%).
  ALL grids use MOBILE-FIRST approach: single column base that expands on larger screens.
  
  RESPONSIVE BEHAVIOR:
  - Mobile (< 768px):  Single column (grid-cols-1) - content stacks vertically
  - Tablet (768px+):   Two columns for most grids (md:grid-cols-2)
  - Desktop (1024px+): Full layout including Golden Ratio splits (lg:grid-cols-*)
  
  GRID GAP SCALING:
  | Breakpoint | Class     | Value |
  |------------|-----------|-------|
  | Mobile     | gap-8     | 32px  |
  | Desktop    | lg:gap-12 | 48px  |
  
  GOLDEN RATIO SPLITS:
  - Minor: 38.2% (1 / 1.618)
  - Major: 61.8% (1.618 / 2.618)
-->

<!-- ============================================================================
     GOLDEN RATIO SPLIT - Major content on right (61.8%)
     Content stacks on mobile, splits on desktop
     ============================================================================ -->
<div class="grid grid-cols-1 lg:grid-cols-[38.2%_61.8%] gap-8 lg:gap-12 items-center">
  <div>
    <!-- Minor content (38.2%) - Image, sidebar, secondary info -->
    <!-- Shows FIRST on mobile (stacked on top) -->
    <div class="aspect-[1/1.618] lg:aspect-[1.618/1] overflow-hidden rounded-2xl bg-neutral-100">
      <img src="..." alt="..." class="w-full h-full object-cover">
    </div>
  </div>
  <div>
    <!-- Major content (61.8%) - Main text, primary info -->
    <!-- Shows SECOND on mobile -->
    <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-neutral-900 mb-4 md:mb-6">
      {Major Content Headline}
    </h2>
    <p class="text-lg md:text-xl text-neutral-600 leading-relaxed mb-6 md:mb-8">
      {Description text that provides context and detail}
    </p>
    <a href="#" class="inline-flex px-6 py-3 bg-primary-600 text-white font-semibold rounded-lg">
      {CTA Button}
    </a>
  </div>
</div>
