<!--
  GRSection - Golden Ratio Section Template
  
  Pre-validated section template with correct RESPONSIVE padding and container structure.
  Use this as the base for all new sections. ALL sections must look perfect at every breakpoint.
  
  RESPONSIVE BREAKPOINTS:
  - Mobile (< 768px):  Base styles, single column, minimum 32px horizontal padding
  - Tablet (768px+):   md: prefix, 2-column grids, 48px horizontal padding
  - Desktop (1024px+): lg: prefix, full columns, 64px horizontal padding
  
  SECTION PADDING VARIANTS:
  | Variant  | Mobile    | Tablet      | Desktop     |
  |----------|-----------|-------------|-------------|
  | Standard | py-16     | md:py-20    | lg:py-24    |
  | Compact  | py-12     | md:py-16    | lg:py-20    |
  | Large    | py-20     | md:py-32    | lg:py-40    |
  
  CONTAINER PADDING (All variants):
  | Breakpoint | Class     | Value |
  |------------|-----------|-------|
  | Mobile     | px-8      | 32px  |
  | Tablet     | md:px-12  | 48px  |
  | Desktop    | lg:px-16  | 64px  |
  
  Background options:
  - bg-white (default)
  - bg-neutral-50
  - bg-neutral-900 text-neutral-300
  - bg-gradient-to-br from-primary-600 to-primary-800 text-white
-->

<!-- ============================================================================
     STANDARD SECTION
     Use for most content sections (Features, Testimonials, FAQ, etc.)
     ============================================================================ -->
<section
  class="py-16 md:py-20 lg:py-24 bg-white"
  data-section="{SectionName}"
  data-tokens='{"padding": "64px/80px/96px", "container": "32px/48px/64px", "variant": "standard"}'
>
  <div class="max-w-7xl mx-auto px-8 md:px-12 lg:px-16">
    
    <!-- Section Header (Optional but recommended) -->
    <div class="max-w-3xl mx-auto text-center mb-12 md:mb-16">
      <!-- H2 with responsive typography -->
      <h2 class="text-3xl md:text-4xl lg:text-5xl font-bold text-neutral-900 mb-4">
        {Section Headline}
      </h2>
      <p class="text-lg md:text-xl text-neutral-600 leading-relaxed">
        {Section description text goes here}
      </p>
    </div>
    
    <!-- Section Content - Use responsive grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 lg:gap-12">
      <!-- Content items - stack on mobile, expand on larger screens -->
      {Content goes here}
    </div>
    
  </div>
</section>
