<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Prototype Starter Kit</title>
    <meta name="description" content="Get in touch with our team" />
    <link rel="stylesheet" href="../styles/tokens.css" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/wireframe.css" />
  </head>
  <body>
    <a href="#main-content" class="skip-to-main">Skip to main content</a>

    <!-- Header -->
    <div id="header-section"></div>

    <!-- Main Content -->
    <main id="main-content">
      <!-- Hero Section -->
      <section
        class="relative section bg-gradient-to-br from-primary-600 to-secondary-600 text-white"
        data-section="HeroContact"
        data-elementor-widget-suggestion="Container, Heading, Text Editor"
      >
        <div class="container-custom">
          <div class="max-w-3xl mx-auto text-center" data-animate="fade-up">
            <h1 class="mb-6 text-5xl md:text-6xl font-bold">Get in Touch</h1>
            <p class="text-xl md:text-2xl text-primary-100 leading-relaxed">
              Have questions? We're here to help. Send us a message and we'll respond as soon as
              possible.
            </p>
          </div>
        </div>
      </section>

      <!-- Contact Section -->
      <div id="contact-section"></div>
    </main>

    <!-- Footer -->
    <div id="footer-section"></div>

    <!-- Handoff Overlay Toggle -->
    <div id="handoff-overlay-root"></div>

    <script type="module" src="../scripts/main.ts"></script>
    <script type="module" src="../scripts/animations.ts"></script>
    <script type="module" src="../scripts/overlay.ts"></script>
    <script type="module" src="../scripts/wireframe.ts"></script>
    <script type="module">
      async function loadSection(sectionId, sectionFile) {
        const response = await fetch(`../sections/${sectionFile}.html`);
        const html = await response.text();
        document.getElementById(sectionId).innerHTML = html;
      }

      Promise.all([
        loadSection('header-section', 'Header'),
        loadSection('contact-section', 'Contact'),
        loadSection('footer-section', 'Footer'),
      ]).then(() => {
        window.dispatchEvent(new Event('sections-loaded'));
      });
    </script>
  </body>
</html>
