<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Presentation - Review & Export</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Review and export website content for translation and approval" />
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/content-presentation.css" />
    <script type="module" src="../../scripts/content-presentation.ts"></script>
  </head>
  <body class="bg-neutral-50">
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-neutral-200 shadow-soft">
      <div class="container-custom">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-green-600 rounded-lg flex items-center justify-center" aria-hidden="true">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
            </div>
            <div>
              <h1 class="text-xl font-bold text-neutral-900">Content Review</h1>
              <p class="text-neutral-500 text-sm">Multilingual Content Presentation</p>
            </div>
          </div>
          
          <!-- Language Switcher -->
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
              <span class="text-sm text-neutral-600">Language:</span>
              <select id="language-selector" class="px-3 py-2 border border-neutral-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                <option value="en">English (EN)</option>
                <option value="es">Spanish (ES)</option>
              </select>
            </div>
            <a href="../handoff/" class="text-primary-600 hover:text-primary-700 text-sm font-medium">
              Back to Portal
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="py-8">
      <div class="container-custom">
        <!-- Controls Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8 p-4 bg-white rounded-xl border border-neutral-200">
          <div class="flex items-center gap-4">
            <span class="text-sm text-neutral-600">Jump to:</span>
            <nav id="page-nav" class="flex flex-wrap gap-2">
              <!-- Page buttons will be populated by JS -->
            </nav>
          </div>
          <div class="flex items-center gap-2">
            <button id="export-csv-btn" class="px-4 py-2 text-sm font-medium text-neutral-700 bg-neutral-100 rounded-lg hover:bg-neutral-200 transition-colors">
              Export CSV
            </button>
            <button id="export-json-btn" class="px-4 py-2 text-sm font-medium text-neutral-700 bg-neutral-100 rounded-lg hover:bg-neutral-200 transition-colors">
              Export JSON
            </button>
            <button id="toggle-compare" class="px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 transition-colors">
              Compare Languages
            </button>
          </div>
        </div>

        <!-- Content Display -->
        <div id="content-container" class="space-y-8">
          <!-- Content sections will be populated by JS -->
          <div class="text-center py-12">
            <div class="inline-flex items-center gap-2 text-neutral-500">
              <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Loading content...</span>
            </div>
          </div>
        </div>

        <!-- Compare View (Hidden by default) -->
        <div id="compare-container" class="hidden">
          <div class="grid md:grid-cols-2 gap-6">
            <div id="compare-left" class="space-y-6">
              <h3 class="text-lg font-semibold text-neutral-800 sticky top-20 bg-neutral-50 py-2">
                <span id="compare-left-lang">English</span>
              </h3>
              <!-- Left language content -->
            </div>
            <div id="compare-right" class="space-y-6">
              <h3 class="text-lg font-semibold text-neutral-800 sticky top-20 bg-neutral-50 py-2">
                <span id="compare-right-lang">Spanish</span>
              </h3>
              <!-- Right language content -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-neutral-900 text-neutral-400 py-8 mt-12">
      <div class="container-custom text-center">
        <p class="text-sm">Content Presentation - For review and translation purposes</p>
        <p class="text-xs mt-2">Content is managed via JSON files in src/content/</p>
      </div>
    </footer>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-neutral-900 text-white px-4 py-2 rounded-lg shadow-large transform translate-y-full opacity-0 transition-all duration-300 z-50">
      Action completed
    </div>
  </body>
</html>
