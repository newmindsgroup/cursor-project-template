<header
  class="fixed top-0 left-0 right-0 z-50 bg-white/90 backdrop-blur-lg border-b border-neutral-200"
  data-section="Header"
  data-elementor-widget-suggestion="Container, Logo, Nav Menu, Button"
  data-notes="Elementor: Sticky Container - Flex row, justify-between, padding-y-4, backdrop-blur"
  data-tokens='{"padding": "1rem 1.5rem", "gap": "2rem"}'
>
  <nav class="container-custom">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-2" aria-label="Prototype - Home">
        <div class="w-10 h-10 bg-primary-600 rounded-lg flex items-center justify-center" aria-hidden="true">
          <span class="text-white font-bold text-xl">P</span>
        </div>
        <span class="text-xl font-bold text-neutral-900">Prototype</span>
      </a>

      <!-- Desktop Navigation -->
      <div class="hidden lg:flex items-center gap-8">
        <a
          href="/"
          class="relative px-4 py-2 text-base font-medium text-primary-600 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-full after:bg-primary-600"
        >
          Home
        </a>
        <a
          href="/about.html"
          class="relative px-4 py-2 text-base font-medium text-neutral-700 transition-colors duration-200 hover:text-primary-600 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-primary-600 after:transition-all after:duration-300 hover:after:w-full"
        >
          About
        </a>
        <a
          href="/services.html"
          class="relative px-4 py-2 text-base font-medium text-neutral-700 transition-colors duration-200 hover:text-primary-600 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-primary-600 after:transition-all after:duration-300 hover:after:w-full"
        >
          Services
        </a>
        <a
          href="/contact.html"
          class="relative px-4 py-2 text-base font-medium text-neutral-700 transition-colors duration-200 hover:text-primary-600 after:absolute after:bottom-0 after:left-0 after:h-0.5 after:w-0 after:bg-primary-600 after:transition-all after:duration-300 hover:after:w-full"
        >
          Contact
        </a>
      </div>

      <!-- CTA Button (Desktop) -->
      <div class="hidden lg:block">
        <a
          href="/contact.html"
          class="inline-flex items-center justify-center px-6 py-3 text-base font-semibold text-white bg-primary-600 rounded-lg transition-all duration-300 hover:bg-primary-700 hover:shadow-medium focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 active:scale-95"
        >
          Get Started
        </a>
      </div>

      <!-- Mobile Menu Button -->
      <button
        id="mobile-menu-button"
        class="lg:hidden p-2 text-neutral-700 hover:text-primary-600 focus:outline-none focus:ring-2 focus:ring-primary-500 rounded-lg"
        aria-label="Toggle mobile menu"
      >
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden lg:hidden py-4">
      <div class="flex flex-col gap-2">
        <a
          href="/"
          class="block px-4 py-3 text-lg font-medium text-primary-600 bg-primary-50 rounded-lg"
        >
          Home
        </a>
        <a
          href="/about.html"
          class="block px-4 py-3 text-lg font-medium text-neutral-700 transition-colors duration-200 hover:text-primary-600 hover:bg-primary-50 rounded-lg"
        >
          About
        </a>
        <a
          href="/services.html"
          class="block px-4 py-3 text-lg font-medium text-neutral-700 transition-colors duration-200 hover:text-primary-600 hover:bg-primary-50 rounded-lg"
        >
          Services
        </a>
        <a
          href="/contact.html"
          class="block px-4 py-3 text-lg font-medium text-neutral-700 transition-colors duration-200 hover:text-primary-600 hover:bg-primary-50 rounded-lg"
        >
          Contact
        </a>
        <a
          href="/contact.html"
          class="inline-flex items-center justify-center px-6 py-3 mt-2 text-base font-semibold text-white bg-primary-600 rounded-lg transition-all duration-300 hover:bg-primary-700"
        >
          Get Started
        </a>
      </div>
    </div>
  </nav>
</header>
