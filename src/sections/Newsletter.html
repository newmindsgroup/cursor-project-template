<section
  class="section bg-gradient-to-br from-primary-600 to-primary-800"
  data-section="Newsletter"
  data-elementor-widget-suggestion="Container, Heading, Form, Text Editor"
  data-notes="Elementor: Container with gradient background > Heading + inline form with email field and button"
  data-tokens='{"padding": "96px 24px", "background": "gradient"}'
>
  <div class="container-custom">
    <div class="max-w-3xl mx-auto text-center">
      <!-- Icon -->
      <div class="inline-flex items-center justify-center w-16 h-16 mb-6 bg-white/20 rounded-2xl" data-animate="fade-up">
        <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>

      <!-- Header -->
      <h2 class="mb-4 text-3xl md:text-4xl font-bold text-white" data-animate="fade-up" data-animate-delay="100">
        Stay in the Loop
      </h2>
      <p class="mb-8 text-lg text-primary-100" data-animate="fade-up" data-animate-delay="200">
        Subscribe to our newsletter for the latest insights, tips, and exclusive offers. No spam, unsubscribe anytime.
      </p>

      <!-- Form -->
      <form class="flex flex-col sm:flex-row gap-4 max-w-lg mx-auto" data-animate="fade-up" data-animate-delay="300">
        <div class="flex-1">
          <label for="newsletter-email" class="sr-only">Email address</label>
          <input
            type="email"
            id="newsletter-email"
            placeholder="Enter your email"
            class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-lg text-white placeholder-primary-200 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-transparent transition-all"
            required
          />
        </div>
        <button
          type="submit"
          class="px-8 py-4 bg-white text-primary-600 font-semibold rounded-lg hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary-600 transition-all"
        >
          Subscribe
        </button>
      </form>

      <!-- Trust Text -->
      <p class="mt-6 text-sm text-primary-200" data-animate="fade-up" data-animate-delay="400">
        <svg class="inline-block w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        We respect your privacy. Your email is safe with us.
      </p>
    </div>
  </div>
</section>
