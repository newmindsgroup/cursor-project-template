<section
  class="section bg-white border-y border-neutral-200"
  data-section="Stats"
  data-elementor-widget-suggestion="Container, Counter"
  data-notes="Elementor: Container > 4-column grid on desktop, gap-8, border-top/bottom"
  data-tokens='{"padding": "64px 24px", "gap": "2rem", "columns": "4"}'
>
  <div class="container-custom">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-8" data-animate="fade-up">
      <!-- Stat 1 -->
      <div class="text-center">
        <div
          class="mb-2 text-5xl font-bold text-primary-600"
          data-counter="true"
          data-target="99"
          data-suffix="%"
        >
          0%
        </div>
        <div class="text-lg text-neutral-600">Faster Workflow</div>
      </div>

      <!-- Stat 2 -->
      <div class="text-center">
        <div
          class="mb-2 text-5xl font-bold text-primary-600"
          data-counter="true"
          data-target="100"
          data-suffix="+"
        >
          0+
        </div>
        <div class="text-lg text-neutral-600">Components</div>
      </div>

      <!-- Stat 3 -->
      <div class="text-center">
        <div
          class="mb-2 text-5xl font-bold text-primary-600"
          data-counter="true"
          data-target="24"
          data-suffix="/7"
        >
          0/7
        </div>
        <div class="text-lg text-neutral-600">Support</div>
      </div>

      <!-- Stat 4 -->
      <div class="text-center">
        <div
          class="mb-2 text-5xl font-bold text-primary-600"
          data-counter="true"
          data-target="5"
          data-prefix="★"
        >
          ★0
        </div>
        <div class="text-lg text-neutral-600">Rating</div>
      </div>
    </div>
  </div>
</section>
